name: SignMarkersRedux
version: ${version}
main: net.immortalmc.bluemap_sign_markers.SignMarkers
api-version: '${apiVersion}'
folia-supported: true
authors: [deimiczny, LiaH]
depend: [BlueMap]
description: Easily add markers to BlueMap with in-game signs

commands:
  signmarkers:
    description: List, remove and place signs for BlueMap sign markers
    usage: "/signmarkers <list|remove|place-sign|reapply|regenerate> [marker-id]"
    permission: signmarkers.admin

permissions:
  signmarkers.admin:
    description: Manage BlueMap sign markers
    default: op
